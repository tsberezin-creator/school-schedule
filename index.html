
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101326">
<title>School Schedule</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{color-scheme:dark;--bg:#0b0d19;--panel:#151a2e;--panel2:#1d2440;--text:#f4f6ff;--muted:#aab2d0;--accent:#8b7cff;--line:#303858}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#25204b 0,transparent 38%),var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:auto}
.top{padding:24px 4px 14px}
.eyebrow{color:#b9b1ff;font-size:12px;letter-spacing:.14em}
.top h1{font-size:30px;margin:7px 0}
.sub{color:var(--muted);font-size:14px}
.panel{background:linear-gradient(145deg,#191e35,#121629);border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 10px 30px #0003}
.current{border-color:#665bd1}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.08em}
.big{font-size:23px;font-weight:750;margin:8px 0}
.muted{color:var(--muted);font-size:14px;line-height:1.45}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;color:#c5bdff;margin-top:10px}
.days{display:flex;gap:8px;overflow:auto;padding:5px 0 10px}
.day{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:10px 13px;white-space:nowrap;font-weight:650}
.day.active{background:var(--accent);border-color:var(--accent);color:white}
.lesson{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.time{width:95px;flex:none;color:#c4bcff;font-weight:700;font-size:13px}
.details{min-width:0;flex:1}
.subject{font-weight:750;font-size:16px}
.meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 13px;font-weight:650;font-size:14px}
button.primary{background:var(--accent);border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.empty{padding:18px 0;color:var(--muted)}
.section-title{font-size:18px;margin:20px 4px 8px}
.foot{padding:10px 4px 20px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
<header class="top">
<div class="eyebrow">ТВОЁ РАСПИСАНИЕ</div>
<h1>School Schedule</h1>
<div class="sub" id="todayLabel">Загрузка…</div>
</header>

<section class="panel current">
<div class="kicker" id="status">СЕЙЧАС</div>
<div class="big" id="currentSubject">Проверяем расписание…</div>
<div class="muted" id="currentInfo"></div>
<div class="timer" id="timer">--:--</div>
<div class="muted" id="nextInfo"></div>
<div class="actions">
<button class="primary" id="notifyBtn">Включить напоминания</button>
</div>
<div class="note" id="notifyNote">Разреши уведомления, чтобы получать напоминания, пока приложение открыто.</div>
</section>

<div class="section-title">Расписание по дням</div>
<nav class="days" id="days"></nav>

<section class="panel">
<div class="kicker" id="selectedLabel">Уроки</div>
<div id="lessonList"></div>
</section>

<div class="foot">Расписание повторяется каждую неделю. Выходные — суббота и воскресенье.</div>
</main>

<script>
const names=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];

const weekly={
"Понедельник":[
["08:30","09:15","Разговоры о важном","104","Юлия Владимировна Хаимова",""],
["09:30","10:15","Английский язык","311","Юлия Сергеевна Галкина","Школьное образование"],
["10:30","11:15","Информатика","213","Фирдус Фанилович Юсупов","Информация и информационные процессы"],
["11:30","12:15","Физика","115","Сергей Сергеевич Илюхин","Основы молекулярно-кинетической теории"],
["12:25","13:10","Геометрия","205","Малика Салмановна Котиева","Прямые и плоскости в пространстве. Параллельность прямых и плоскостей."],
["13:30","14:15","Литература","206","Юлия Артёмовна Степаниденко","Литература второй половины XIX века. Н. А. Некрасов"],
["14:35","15:20","Алгебра и начала математического анализа","205","Малика Салмановна Котиева","Арифметический корень n-ой степени. Иррациональные уравнения"]
],
"Вторник":[
["08:30","09:15","Обществознание","203","Наталья Дмитриевна Рогожина","Введение в философию"],
["09:30","10:15","Алгебра и начала математического анализа","205","Малика Салмановна Котиева","Арифметический корень n-ой степени. Иррациональные уравнения"],
["10:30","11:15","Практикум по обществознанию","203","Наталья Дмитриевна Рогожина","Повторение изученного"],
["11:30","12:15","Английский язык","311","Юлия Сергеевна Галкина","Школьное образование"],
["12:25","13:10","Русский язык","206","Юлия Артёмовна Степаниденко","Язык и речь. Культура речи. Лексикология и фразеология. Лексические нормы."],
["13:30","14:15","ОБЗР","102","Андрей Владимирович Клишин","НВП. Основы военной подготовки."],
["14:35","15:20","Математический практикум","205","Малика Салмановна Котиева","Многочлены"]
],
"Среда":[
["08:30","09:15","Обществознание","203","Наталья Дмитриевна Рогожина","Введение в социальную психологию"],
["09:30","10:15","Биология","308","Людмила Викторовна Филиппова","Химический состав и строение клетки"],
["10:30","11:15","Практикум по русскому языку","206","Юлия Артёмовна Степаниденко","Введение"],
["11:30","12:15","Геометрия","205","Малика Салмановна Котиева","Прямые и плоскости в пространстве. Параллельность прямых и плоскостей."],
["12:25","13:10","Алгебра и начала математического анализа","205","Малика Салмановна Котиева","Арифметический корень n-ой степени. Иррациональные уравнения"],
["13:30","14:15","Литература","206","Юлия Артёмовна Степаниденко","Литература второй половины XIX века. Н. А. Некрасов"],
["14:35","15:20","Обществознание","203","Наталья Дмитриевна Рогожина","Введение в социальную психологию"]
],
"Четверг":[
["08:30","09:15","Обществознание","203","Наталья Дмитриевна Рогожина","Введение в социальную психологию"],
["09:30","10:15","Русский язык","206","Юлия Артёмовна Степаниденко","Язык и речь. Культура речи. Лексикология и фразеология. Лексические нормы."],
["10:30","11:15","Химия","306","Наталья Валериевна Королева","Ароматические углеводороды"],
["11:30","12:15","География","103","Сергей Анатольевич Монахов","Современная политическая карта. Геополитические проблемы."],
["12:25","13:10","История","203","Наталья Дмитриевна Рогожина","Повторение изученного"],
["13:30","14:15","Индивидуальный проект","115","Сергей Сергеевич Илюхин","Подготовка концепции реализации проекта"],
["14:35","15:20","Математический практикум","205","Малика Салмановна Котиева","Многочлены"]
],
"Пятница":[
["08:30","09:15","Алгебра и начала математического анализа","205","Малика Салмановна Котиева","Арифметический корень n-ой степени. Иррациональные уравнения"],
["09:30","10:15","Физкультура","403","Андрей Владимирович Клишин","Спортивно-оздоровительная деятельность. Спортивные игры."],
["10:30","11:15","Вероятность и статистика","205","Малика Салмановна Котиева","Операции над событиями, сложение вероятностей."],
["11:30","12:15","Литература","206","Юлия Артёмовна Степаниденко","Литература второй половины XIX века. А. А. Фет"],
["12:25","13:10","История","203","Наталья Дмитриевна Рогожина","Россия и мир накануне Первой мировой войны"],
["13:30","14:15","Физика","121","Сергей Сергеевич Илюхин","Основы молекулярно-кинетической теории"]
],
"Суббота":[],
"Воскресенье":[]
};

let selected=names[new Date().getDay()];
let notified=new Set();
let notificationsEnabled=false;

const pad=n=>String(n).padStart(2,"0");
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function renderDays(){
 const nav=document.getElementById("days");
 nav.innerHTML="";
 ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"].forEach(day=>{
  const b=document.createElement("button");
  b.className="day"+(selected===day?" active":"");
  b.textContent=day;
  b.onclick=()=>{selected=day;renderDays();renderLessons()};
  nav.appendChild(b);
 });
}

function renderLessons(){
 const list=document.getElementById("lessonList");
 document.getElementById("selectedLabel").textContent=selected;
 const rows=weekly[selected]||[];
 if(!rows.length){
  list.innerHTML='<div class="empty">В этот день уроков нет. Отдыхай!</div>';
  return;
 }
 list.innerHTML=rows.map(x=>`
  <div class="lesson">
   <div class="time">${x[0]}–${x[1]}<div style="color:#8f98b8;margin-top:5px">каб. ${x[3]}</div></div>
   <div class="details">
    <div class="subject">${x[2]}</div>
    <div class="meta">${x[4]}</div>
    ${x[5]?`<div class="meta">Тема: ${x[5]}</div>`:""}
   </div>
  </div>
 `).join("");
}

function notifyOnce(id,msg){
 if(!notificationsEnabled||notified.has(id))return;
 notified.add(id);
 if("serviceWorker" in navigator){
  navigator.serviceWorker.ready.then(reg=>{
   reg.showNotification("School Schedule",{body:msg,icon:"./icon.png"});
  }).catch(()=>{});
 }
}

function tick(){
 const now=new Date();
 const day=names[now.getDay()];
 const schedule=weekly[day]||[];

 document.getElementById("todayLabel").textContent=
  now.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});

 let current=null,next=null;

 for(const l of schedule){
  const s=new Date(dateKey(now)+"T"+l[0]+":00");
  const e=new Date(dateKey(now)+"T"+l[1]+":00");
  if(now>=s&&now<e)current={l,s,e};
  if(now<s&&!next)next={l,s};
 }

 const status=document.getElementById("status");
 const sub=document.getElementById("currentSubject");
 const info=document.getElementById("currentInfo");
 const timer=document.getElementById("timer");
 const ni=document.getElementById("nextInfo");

 if(current){
  status.textContent="ИДЁТ УРОК";
  sub.textContent=current.l[2];
  info.textContent=current.l[0]+"–"+current.l[1]+" · каб. "+current.l[3];
  const sec=Math.max(0,Math.floor((current.e-now)/1000));
  timer.textContent=pad(Math.floor(sec/60))+":"+pad(sec%60);
  ni.textContent=next?"Следующий урок: "+next.l[2]+" в "+next.l[0]:"Это последний урок на сегодня.";
  if(sec<=300&&sec>0)notifyOnce(dateKey(now)+"-"+current.l[0]+"-end","До конца урока 5 минут.");
 }else if(next){
  status.textContent="СЛЕДУЮЩИЙ УРОК";
  sub.textContent=next.l[2];
  info.textContent="Начало в "+next.l[0]+" · каб. "+next.l[3];
  const sec=Math.max(0,Math.floor((next.s-now)/1000));
  timer.textContent=pad(Math.floor(sec/60))+":"+pad(sec%60);
  ni.textContent="До начала следующего урока.";
  if(sec<=300&&sec>0)notifyOnce(dateKey(now)+"-"+next.l[0]+"-start","До конца перемены 5 минут. Следующий урок: "+next.l[2]+", кабинет "+next.l[3]+".");
 }else{
  status.textContent="УРОКОВ СЕЙЧАС НЕТ";
  sub.textContent=schedule.length?"Занятия на сегодня закончились":"Сегодня выходной";
  info.textContent="";
  timer.textContent="";
  ni.textContent="";
 }
}

document.getElementById("notifyBtn").onclick=async()=>{
 const note=document.getElementById("notifyNote");
 if(!("Notification" in window)){
  document.getElementById("notifyNote").textContent =
  "Standalone: " + window.matchMedia("(display-mode: standalone)").matches +
" | iOS standalone: " + window.navigator.standalone +
" | Service Worker: " + ("serviceWorker" in navigator)  
  return;
}

document.getElementById("notifyNote").textContent =
  "Standalone: " + window.matchMedia("(display-mode: standalone)").matches +
  " | Service Worker: " + ("serviceWorker" in navigator) +
  " | Permission: " + Notification.permission;
 try{
  const permission=await Notification.requestPermission();
  if(permission!=="granted"){
   note.textContent="Разрешение не выдано. Проверь настройки уведомлений.";
   return;
  }
  if("serviceWorker" in navigator){
   const reg=await navigator.serviceWorker.ready;
   await reg.showNotification("School Schedule",{body:"Напоминания включены!"});
   notificationsEnabled=true;
   note.textContent="Уведомления разрешены. Напоминания работают, пока приложение открыто.";
  }else{
   note.textContent="Service Worker не поддерживается в этом браузере.";
  }
 }catch(e){
  note.textContent="Не удалось включить уведомления. Проверь настройки Safari и приложения.";
 }
};

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
 });
}

renderDays();
renderLessons();
tick();
setInterval(tick,1000);
</script>
</body>
</html>
